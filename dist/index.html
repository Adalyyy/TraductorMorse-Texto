<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodigoMorse</title>
</head>
<body>
    
    <div class="container">
        <div class="row">
            <div class="col">
                <label for="palabra">Ingrese el texto a Codificar</label>
                <input type="text" id="palabra" class="form-control">
            </div>
        </div>
        <button id="codigoM" class="btn btn-outline-info mt-2 mb-3">Convertir a Morse</button>
        <button id="codigoT" class="btn btn-outline-success mt-2 mb-3">Convertir a Texto</button>
        <button id="borrar" type="button" class="btn btn-outline-danger mt-2 mb-3">Borrar</button>
    </div>
    <div class="container">
        <div class="row">
            <div class="col">
                <p id="respuesta"></p>
            </div>
        </div>
    </div>
  
    
    <script src="bundle.js"></script>
</body>
</html>
